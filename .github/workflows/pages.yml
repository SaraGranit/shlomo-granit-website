name: Publish static site to gh-pages

on:
  push:
    branches: [main]
    paths: ['static-site/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push origin "$(git subtree split --prefix static-site HEAD):refs/heads/gh-pages" --force
